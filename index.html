<style>
  :root {
    --ground: #F4F2EE;
    --paper: #FBFAF7;
    --ink: #161616;
    --ink-2: #4A4744;
    --ink-3: #55524E;
    --red: #D23A1F;
    --intro: #CFE3C8;
    --display: 'Space Grotesk', Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  a { color: var(--ink); }
  a:hover { color: #E5482D; }
  .red { color: var(--red); }

  .wrap { max-width: 1440px; margin: 0 auto; padding: 40px 40px 64px; }
  @media (max-width: 640px) { .wrap { padding: 24px 16px 48px; } }

  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 24px; padding-bottom: 32px; }
  header h1 { margin: 0; font-family: var(--display); font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }

  /* Contact icons (email copies the address, LinkedIn opens the profile) */
  .contact { display: flex; gap: 8px; }
  .icon-link {
    display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0;
    border: 0; border-radius: 22px; background: transparent; color: var(--ink); cursor: pointer; font: inherit;
    text-decoration: none; transition: color .15s ease, background .15s ease;
  }
  .icon-link:hover, .icon-link:focus-visible { color: var(--red); background: #E9E5DE; }

  /* Grid */
  .grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .col { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 16px; }

  .tile {
    flex: 1 1 0; min-width: 0; position: relative; border: 0; padding: 0; border-radius: 4px;
    cursor: pointer; font: inherit; color: var(--ink); text-align: left; overflow: hidden;
    transition: transform .2s ease, box-shadow .2s ease; will-change: transform;
  }
  .tile:hover, .tile:focus-visible { transform: scale(1.03); z-index: 2; box-shadow: 0 14px 32px rgba(0,0,0,.18); }
  /* Coming soon tiles don't grow on hover and don't open. */
  .tile.soon { cursor: default; }
  .tile.soon:hover, .tile.soon:focus-visible { transform: none; box-shadow: none; }
  .tile .img-wrap { position: absolute; inset: 0; overflow: hidden; }
  .tile .img-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
  .tile .logo-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .tile .logo-wrap img { width: 60%; height: 50%; object-fit: contain; object-position: 50% 50%; display: block; }
  .tile.has-img .placeholder { display: none; }
  .tile .placeholder {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #3A3835;
  }
  .caption {
    position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap;
    justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 3px;
    background: rgba(251,250,247,0.94); font-size: 13px;
  }
  .caption b { font-weight: 600; }
  .caption span { color: var(--ink-3); }

  /* Coming soon band, tilted across the tile */
  .banner-wrap { position: absolute; inset: 0; overflow: hidden; border-radius: 4px; pointer-events: none; }
  .banner {
    position: absolute; left: 50%; width: 170%; transform: translate(-50%, -50%) rotate(-20deg);
    background: var(--red); color: #FFFFFF; text-align: center; padding: 14px 0; white-space: nowrap;
    font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }

  /* Intro block (no hover) */
  .intro {
    flex: 1 1 0; min-width: 0; border-radius: 18px; background: var(--intro); padding: 14px;
    display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: var(--ink);
  }
  .intro:hover { color: var(--ink); }
  .intro .photo { flex: 1 1 auto; min-height: 0; border-radius: 12px; background: #EAE6DF; overflow: hidden; }
  .intro .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
  .intro .hello {
    padding: 10px 12px; border-radius: 12px; background: rgba(251,250,247,0.94);
    font-family: var(--display); font-size: 26px; font-weight: 600; letter-spacing: -0.01em;
  }

  /* Section heading inside the grid */
  .section-heading {
    flex: 1 1 0; min-width: 0; margin: 0; display: flex; align-items: center; justify-content: flex-end; text-align: right;
    font-family: var(--display); font-size: 40px; line-height: 1; font-weight: 600; letter-spacing: -0.02em; color: var(--ink);
  }

  /* Copied toast */
  .toast {
    display: none; position: fixed; left: 50%; bottom: 56px; z-index: 20; transform: translateX(-50%);
    align-items: center; gap: 10px; padding: 12px 18px 12px 14px; border-radius: 999px;
    background: #FFFFFF; color: var(--ink); font-size: 15px; font-weight: 500; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06);
  }
  .toast.show { display: flex; animation: toastIn .2s ease both; }
  .toast .check {
    width: 24px; height: 24px; border-radius: 12px; background: #2E9E5B; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* Book overlay */
  .overlay { position: fixed; inset: 0; z-index: 10; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  .backdrop { position: fixed; inset: 0; border: 0; padding: 0; background: rgba(12,12,12,0.74); cursor: pointer; animation: fadeIn .25s ease both; }
  .stage { position: relative; display: flex; justify-content: center; padding: 64px 24px; pointer-events: none; }
  .book {
    display: flex; flex-wrap: wrap; width: 100%; max-width: 1240px; pointer-events: auto;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,0.45));
    perspective: 2200px; animation: bookIn .25s cubic-bezier(.2,.75,.25,1) both;
  }
  .page-l, .page-r { flex: 1 1 440px; min-width: 0; min-height: 660px; background: var(--paper); }
  .page-l {
    padding: 28px; border-radius: 6px 0 0 6px; box-shadow: inset -22px 0 28px -22px rgba(0,0,0,0.28);
    display: flex; flex-direction: column; gap: 12px;
    transform-origin: right center; animation: openL .25s cubic-bezier(.2,.75,.25,1) both;
  }
  .page-l.centered { min-height: 0; justify-content: center; }
  .page-r {
    position: relative; padding: 40px 44px; border-radius: 0 6px 6px 0; box-shadow: inset 22px 0 28px -22px rgba(0,0,0,0.22);
    display: flex; flex-direction: column; gap: 20px;
    transform-origin: left center; animation: openR .25s cubic-bezier(.2,.75,.25,1) both;
  }
  .is-closing .backdrop { animation: fadeOut .25s ease both; }
  .is-closing .book { animation: bookOut .25s ease both; }
  .is-closing .page-l { animation: closeL .25s ease both; }
  .is-closing .page-r { animation: closeR .25s ease both; }

  /* Book, standard layout: big photo, column of 4, row below */
  .gallery-top { display: flex; gap: 12px; flex: 1 1 auto; min-height: 440px; }
  .main-img {
    flex: 1 1 0; min-width: 0; position: relative; overflow: hidden; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #3A3835;
  }
  .side { width: 132px; display: flex; flex-direction: column; gap: 12px; }
  .bottom { display: flex; gap: 12px; height: 128px; }
  .thumb {
    flex: 1 1 0; position: relative; border: 0; padding: 0; border-radius: 3px; cursor: pointer; overflow: hidden;
    font: inherit; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #3A3835;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .thumb:hover, .thumb:focus-visible { transform: scale(1.05); z-index: 2; box-shadow: 0 8px 18px rgba(0,0,0,.2); }
  .thumb.sel::after { content: ""; position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: 3px; }
  .main-img img, .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }

  /* Book, AutoDog layout: full-width photo (frame takes the photo's shape), 4 thumbnails below */
  .photo-wrap { display: flex; }
  .photo-frame {
    flex: 1 1 0; min-width: 0; aspect-ratio: 1176 / 1431; display: flex; align-items: center; overflow: hidden;
    border-radius: 3px; background: var(--paper); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #3A3835;
  }
  .photo-frame img { width: 100%; height: auto; border-radius: 3px; display: block; }
  .photo-frame .photo-empty { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .thumb-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 110px; gap: 12px; }

  /* Book, work layout: logo (and SPA program slide) */
  .logo-box { display: block; overflow: hidden; border-radius: 3px; }
  .logo-box.wide { aspect-ratio: 16 / 9; }
  .logo-box.wide img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.8); display: block; }
  .logo-box.square { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: #DCEAF6; }
  .logo-box.square img { width: 62%; height: auto; display: block; }
  .slide { width: 100%; height: auto; border-radius: 3px; display: block; }
  .work-stack { display: flex; flex-direction: column; gap: 12px; }

  .close {
    position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border: 0; border-radius: 22px;
    background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink);
  }
  .close:hover { background: rgba(0,0,0,.06); }
  .kind { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .page-r h2 { margin: 0; font-family: var(--display); font-size: 44px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; }
  .blurb { margin: 0; font-size: 18px; line-height: 1.5; color: #2A2826; }
  .body { margin: 0; font-size: 15px; line-height: 1.65; color: var(--ink-2); }
  dl { margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; font-size: 13px; }
  dt { color: var(--ink-3); }
  dd { margin: 4px 0 0; font-weight: 500; }
  .learn { margin-top: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 20px; border-top: 1px solid #E2DED7; }
  .learn[hidden] { display: none; }
  .learn span { font-family: var(--display); font-size: 24px; font-weight: 500; }
  .cta {
    display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 22px; border-radius: 4px;
    background: var(--red); color: #fff; font-size: 15px; font-weight: 600; text-decoration: none;
  }
  .cta:hover { color: #fff; background: #B8301A; }

  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }
  @keyframes bookIn { from { opacity: 0; transform: scale(.92) translateY(16px) } to { opacity: 1; transform: none } }
  @keyframes bookOut { from { opacity: 1; transform: none } to { opacity: 0; transform: scale(.94) translateY(12px) } }
  @keyframes openL { from { transform: rotateY(85deg) } to { transform: rotateY(0) } }
  @keyframes openR { from { transform: rotateY(-85deg) } to { transform: rotateY(0) } }
  @keyframes closeL { from { transform: rotateY(0) } to { transform: rotateY(85deg) } }
  @keyframes closeR { from { transform: rotateY(0) } to { transform: rotateY(-85deg) } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px) } to { opacity: 1; transform: translate(-50%, 0) } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
  }
</style>

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function shade(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  const f = (c) => Math.round(t < 0 ? c * (1 + t) : c + (255 - c) * t);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

// If an image file is missing, remove it so the colored placeholder shows instead.
function imgTag(src, alt, style) {
  return `<img src="${esc(src)}" alt="${esc(alt)}"${style ? ` style="${style}"` : ''} loading="lazy" onload="this.closest('.tile')?.classList.add('has-img')" onerror="this.remove()">`;
}

function introHTML(h) {
  return `<a href="#" class="intro" aria-label="About Mateo" style="height:${h}px">
    <span class="photo">${imgTag(INTRO_PHOTO, 'Mateo')}</span>
    <span class="hello">Hi, I'm <span class="red">Mateo</span>.</span>
  </a>`;
}

function headingHTML(h) {
  return `<h2 class="section-heading" style="height:${h}px"><span><span class="red">2+ Years</span> of Work Experience</span></h2>`;
}

function tileHTML(id, h) {
  const p = PROJECTS[id];
  let img = '';
  if (p.img && p.logo) {
    const nudge = p.nudgeX ? `transform:translateX(${p.nudgeX}px)` : '';
    img = `<span class="logo-wrap">${imgTag(p.img, p.alt || p.title, nudge)}</span>`;
  } else if (p.img) {
    const zoom = p.zoom ? `transform:scale(${p.zoom})` : '';
    img = `<span class="img-wrap">${imgTag(p.img, p.alt || p.title, zoom)}</span>`;
  }
  const band = p.soon
    ? `<span class="banner-wrap" aria-hidden="true"><span class="banner" style="top:${p.soon.top}">Coming soon &nbsp;·&nbsp; ${p.soon.date}</span></span>`
    : '';
  const label = p.soon ? `${p.title}, coming soon` : `Open ${p.title}`;
  return `<button class="tile${p.soon ? ' soon' : ''}" data-id="${id}" aria-label="${esc(label)}" aria-disabled="${!!p.soon}" style="height:${h}px;background:${p.color}">
    <span class="placeholder">[${esc(p.photo)}]</span>
    ${img}
    ${band}
    <span class="caption"><b>${esc(p.title)}</b><span>${esc(p.kind)}</span></span>
  </button>`;
}

function cellHTML(id, h) {
  if (id === 'intro') return introHTML(h);
  if (id === 'heading') return headingHTML(h);
  return tileHTML(id, h);
}

document.getElementById('grid').innerHTML = LAYOUT.map((col) =>
  `<div class="col" style="flex:${col.flex}">${col.rows.map((row) =>
    `<div class="row">${row.map(([id, h]) => cellHTML(id, h)).join('')}</div>`
  ).join('')}</div>`
).join('');

// ---------- Book ----------
const overlay = document.getElementById('overlay');
let current = null;
let selected = 0;
let lastFocus = null;
let closeTimer = null;

// Photos for the left page. Each: { label, color, src, alt }
function photoItems(p) {
  if (p.gallery) {
    return p.gallery.map((src, i) => ({ label: 'Photo ' + (i + 1), color: p.color, src, alt: `${p.title} photo ${i + 1}` }));
  }
  return LABELS.map((label, i) => ({
    label, color: shade(p.color, TONES[i]),
    src: (p.bookImages && p.bookImages[i]) || null,
    alt: `${p.title} ${label}`
  }));
}

function thumbHTML(it, i, isSel) {
  return `<button class="thumb${isSel ? ' sel' : ''}" data-slot="${i}" aria-label="Show ${esc(it.label)}" style="background:${it.color}">
    ${esc(it.label)}${it.src ? imgTag(it.src, it.alt) : ''}
  </button>`;
}

function thumbsHTML(items, idx) {
  return idx.filter((i) => items[i] && items[i].src).map((i) => thumbHTML(items[i], i, i === selected)).join('');
}

function leftHTML(p, items) {
  const pageL = document.getElementById('page-l');
  const it = items[selected] || items[0];

  if (p.layout === 'feature') {
    pageL.className = 'page-l centered';
    const frame = it.src
      ? `<div class="photo-frame">${imgTag(it.src, it.alt)}</div>`
      : `<div class="photo-frame"><span class="photo-empty" style="background:${it.color}">[${esc(it.label)}]</span></div>`;
    pageL.innerHTML = `<div class="photo-wrap">${frame}</div>
      <div class="thumb-grid">${thumbsHTML(items, items.map((_, i) => i))}</div>`;
    return;
  }

  if (p.layout === 'work') {
    pageL.className = 'page-l centered';
    if (p.logo === 'spa') {
      pageL.innerHTML = `<div class="work-stack">
        <span class="logo-box wide"><img src="${p.img}" alt="SPA, Systems Planning and Analysis logo"></span>
        <img class="slide" src="images/spa-slide.jpg" alt="SPA Program slide: Hypersonic Alternate Navigation, with project description, objectives and a diagram of navigation sources by increasing uncertainty">
      </div>`;
    } else {
      pageL.innerHTML = `<div class="work-stack">
        <span class="logo-box square"><img src="${p.img}" alt="SMX logo"></span>
      </div>`;
    }
    return;
  }

  // Standard layout (gallery books and slot books)
  pageL.className = 'page-l';
  const isGallery = p.layout === 'gallery';
  const sideIdx = isGallery ? [1, 2, 3, 4] : [0, 1, 2, 3];
  const bottomIdx = isGallery ? [5, 6, 7, 8] : [4, 5, 6];
  const main = it.src
    ? imgTag(it.src, it.alt, 'object-position:50% 50%')
    : '';
  const sideHTML = sideIdx.filter((i) => items[i]).map((i) => thumbHTML(items[i], i, i === selected)).join('');
  const bottomHTML = bottomIdx.filter((i) => items[i]).map((i) => thumbHTML(items[i], i, i === selected)).join('');
  pageL.innerHTML = `<div class="gallery-top">
      <div class="main-img" style="background:${it.color}">[${esc(it.label)}]${main}</div>
      <div class="side">${sideHTML}</div>
    </div>
    <div class="bottom">${bottomHTML}</div>`;
}

function renderBook() {
  const p = PROJECTS[current];
  const items = photoItems(p);
  if (selected >= items.length) selected = 0;

  document.getElementById('book-kind').textContent = p.kind;
  document.getElementById('book-title').textContent = p.title;
  document.getElementById('book-blurb').textContent = p.blurb;
  document.getElementById('book-writeup').textContent = p.writeup || '[Write-up: the problem, who it was for, and why it mattered.]';
  document.getElementById('book-process').textContent = p.process || '[Process: research, sketches, prototypes, testing, what changed along the way.]';
  document.getElementById('book-outcome').textContent = p.outcome || '[Outcome: what got built and what you learned.]';
  document.getElementById('book-role').textContent = p.role || '[Your role]';
  document.getElementById('book-team').textContent = p.team || '[Team]';
  document.getElementById('book-tools').textContent = p.tools || '[Skills used]';

  // The Learn more row only shows for projects with a link.
  const learn = document.getElementById('learn');
  const cta = document.getElementById('book-cta');
  learn.hidden = !p.link;
  if (p.link) {
    cta.href = p.link; cta.target = '_blank'; cta.rel = 'noopener';
    document.getElementById('book-cta-text').textContent = p.linkText || 'Read the case study';
  }

  // AutoDog's page is wider on the right, matching its photo layout.
  document.querySelector('.page-r').style.flex = p.layout === 'feature' ? '1.07 1 440px' : '';

  leftHTML(p, items);
}

function openBook(id) {
  clearTimeout(closeTimer);
  current = id;
  selected = 0;
  lastFocus = document.activeElement;
  renderBook();
  overlay.classList.remove('is-closing');
  overlay.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('close').focus();
}

function closeBook() {
  if (overlay.hidden || overlay.classList.contains('is-closing')) return;
  overlay.classList.add('is-closing');
  closeTimer = setTimeout(() => {
    overlay.hidden = true;
    overlay.classList.remove('is-closing');
    document.body.style.overflow = '';
    current = null;
    if (lastFocus) lastFocus.focus();
  }, ANIM_MS);
}

// ---------- Copy email ----------
let toastTimer = null;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

function copyEmail() {
  const fallback = () => {
    try {
      const t = document.createElement('textarea');
      t.value = EMAIL; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
    } catch (e) {}
    showToast();
  };
  try { navigator.clipboard.writeText(EMAIL).then(showToast, fallback); } catch (e) { fallback(); }
}

document.getElementById('copy-email').addEventListener('click', copyEmail);

// ---------- Events ----------
document.getElementById('grid').addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (tile && !PROJECTS[tile.dataset.id].soon) openBook(tile.dataset.id);
});
document.getElementById('backdrop').addEventListener('click', closeBook);
document.getElementById('close').addEventListener('click', closeBook);
overlay.addEventListener('click', (e) => {
  const thumb = e.target.closest('.thumb');
  if (!thumb) return;
  const i = Number(thumb.dataset.slot);
  // Photo books: clicking the shown photo again goes back to the main one.
  // Slot books: clicking a slot shows it.
  const isGallery = !!PROJECTS[current].gallery;
  selected = isGallery && selected === i ? 0 : i;
  renderBook();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeBook();
});
</script>
</body>
</html>
